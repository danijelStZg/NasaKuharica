<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E30613">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kuharica">
<title>Naša Kuharica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --red: #E30613;
    --red-dark: #B30410;
    --bg-app: #F4F5F7;
    --bg-card: #FFFFFF;
    --bg-card-2: #F0F1F4;
    --bg-input: #FFFFFF;
    --bg-input-focus: #FFFFFF;
    --bg-header: #FFFFFF;
    --bg-modal: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-note: #FFF4F4;
    --text-primary: #1F2933;
    --text-secondary: #52606D;
    --text-tertiary: #9AA5B1;
    --text-on-red: #FFFFFF;
    --border: #D9DEE5;
    --border-light: #CBD2D9;
    --divider: #EAECEF;
    --shadow: rgba(31, 41, 51, 0.08);
    --shadow-strong: rgba(31, 41, 51, 0.18);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-app);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--red);
    color: var(--text-on-red);
    padding: 18px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px var(--shadow);
    border-bottom: 3px solid var(--red-dark);
  }

  .menu-btn {
    position: absolute;
    left: 12px;
    top: 18px;
    background: transparent;
    border: none;
    color: var(--text-on-red);
    font-size: 26px;
    cursor: pointer;
    padding: 4px 10px;
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .counter {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    font-weight: 600;
    color: #FFFFFF;
    margin-top: 4px;
    min-height: 30px;
  }

  .search-bar {
    margin-top: 12px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid transparent;
    border-radius: 22px;
    background: #FFFFFF;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .search-bar input::placeholder { color: var(--text-tertiary); }
  .search-bar input:focus { border-color: var(--red-dark); box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }

  .search-bar::before {
    content: '🔍';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.7;
  }

  .category-filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 16px 2px;
    margin: 0 -16px;
    scrollbar-width: none;
  }

  .category-filters::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    padding: 5px 14px;
    background: rgba(255,255,255,0.15);
    color: #FFFFFF;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 14px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  .filter-chip.active {
    background: #FFFFFF;
    color: var(--red);
    border-color: #FFFFFF;
    font-weight: 600;
  }

  .container {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .empty-state h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    margin-bottom: 8px;
    color: var(--red);
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .empty-state .ornament {
    font-family: 'Caveat', cursive;
    font-size: 38px;
    color: var(--red);
    margin-bottom: 8px;
  }

  .recipe-card {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--red);
    box-shadow: 0 2px 6px var(--shadow);
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .recipe-card:active { transform: scale(0.98); background: var(--bg-card-2); }

  .recipe-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
    flex: 1;
  }

  .category-badge {
    display: inline-block;
    padding: 3px 10px;
    background: rgba(227, 6, 19, 0.10);
    color: var(--red);
    border: 1px solid rgba(227, 6, 19, 0.35);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
    font-family: inherit;
  }

  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: var(--red);
    color: var(--text-on-red);
    border: none;
    border-radius: 50%;
    font-size: 32px;
    box-shadow: 0 4px 14px rgba(227, 6, 19, 0.40);
    cursor: pointer;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding-bottom: 4px;
  }

  .fab:active { transform: scale(0.95); background: var(--red-dark); }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 200;
  }

  .modal.active { display: flex; align-items: flex-end; animation: fadeIn 0.2s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }

  .modal-content {
    background: var(--bg-modal);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    overflow-y: auto;
    animation: slideUp 0.3s;
    position: relative;
  }

  .modal-content.full {
    border-radius: 0;
    max-height: 100vh;
    height: 100vh;
  }

  .modal-header {
    padding: 14px 16px;
    background: var(--red);
    color: var(--text-on-red);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--red-dark);
  }

  .modal-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }

  .close-btn, .action-btn {
    background: transparent;
    border: none;
    color: var(--text-on-red);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 10px;
  }

  .modal-body { padding: 22px 18px; }

  .recipe-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--text-primary);
    text-align: center;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .recipe-title-divider {
    text-align: center;
    color: var(--red);
    font-size: 16px;
    margin-bottom: 16px;
    letter-spacing: 4px;
  }

  .recipe-category {
    text-align: center;
    margin-bottom: 22px;
  }

  .recipe-category .badge {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(225, 0, 0, 0.15);
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .recipe-section { margin-bottom: 22px; }

  .recipe-section h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--red);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--divider);
    font-weight: 600;
  }

  .recipe-section h3::before {
    content: '◆';
    color: var(--red);
    margin-right: 8px;
    font-size: 11px;
  }

  .recipe-section .content {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text-primary);
  }

  .recipe-section.note .content {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    background: var(--bg-note);
    padding: 14px 16px;
    border-radius: 6px;
    border-left: 3px solid var(--red);
    color: var(--text-primary);
    line-height: 1.5;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--red);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    background: var(--bg-input);
    color: var(--text-primary);
    resize: vertical;
    outline: none;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: var(--text-tertiary);
  }

  .form-group select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='#E30613' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 36px;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: var(--red);
    background: var(--bg-input-focus);
  }

  .form-group textarea { min-height: 100px; line-height: 1.5; }

  .btn {
    display: inline-block;
    padding: 12px 22px;
    background: var(--red);
    color: var(--text-on-red);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  .btn:active { background: var(--red-dark); }

  .btn.secondary {
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-light);
  }

  .btn.secondary:active { background: var(--bg-card); }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn-row .btn { flex: 1; }

  .drawer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 300;
  }

  .drawer.active { display: block; }

  .drawer-content {
    background: var(--bg-modal);
    width: 280px;
    height: 100%;
    padding: 20px 0;
    box-shadow: 4px 0 16px var(--shadow);
    animation: slideRight 0.25s;
  }

  .drawer-header {
    padding: 0 20px 16px;
    border-bottom: 2px solid var(--red);
    margin-bottom: 8px;
  }

  .drawer-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--text-primary);
  }

  .drawer-item {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--divider);
  }

  .drawer-item:active { background: var(--bg-card); }

  .drawer-item .icon {
    margin-right: 14px;
    font-size: 20px;
    width: 24px;
    text-align: center;
  }

  .action-sheet {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 250;
    align-items: flex-end;
  }

  .action-sheet.active { display: flex; animation: fadeIn 0.2s; }

  .action-sheet-content {
    background: var(--bg-modal);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-radius: 14px 14px 0 0;
    padding: 8px 0;
    animation: slideUp 0.25s;
  }

  .action-sheet-title {
    padding: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
    border-bottom: 1px solid var(--divider);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .action-sheet-item {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--divider);
  }

  .action-sheet-item:last-child { border-bottom: none; }
  .action-sheet-item:active { background: var(--bg-card); }

  .action-sheet-item .icon {
    margin-right: 14px;
    font-size: 22px;
    width: 28px;
    text-align: center;
  }

  .action-sheet-cancel {
    margin: 8px;
    padding: 14px;
    text-align: center;
    background: var(--bg-card);
    border-radius: 8px;
    font-weight: 600;
    color: var(--red);
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elevated);
    color: var(--text-primary);
    border: 1px solid var(--border-light);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 400;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    box-shadow: 0 4px 16px var(--shadow-strong);
  }

  .toast.show { opacity: 1; }

  #fileInput { display: none; }
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="openDrawer()">☰</button>
  <h1>Naša kuharica</h1>
  <div class="counter" id="counter"></div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Pretraži recepte..." oninput="renderList()">
  </div>
  <div class="category-filters" id="categoryFilters"></div>
</header>

<div class="container">
  <div id="recipeList"></div>
</div>

<button class="fab" onclick="openEditor()" title="Novi recept">+</button>

<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer-content">
    <div class="drawer-header">
      <h2>Izbornik</h2>
    </div>
    <div class="drawer-item" onclick="exportAll()">
      <span class="icon">📤</span> Izvoz svih recepata
    </div>
    <div class="drawer-item" onclick="importRecipes()">
      <span class="icon">📥</span> Uvoz recepata
    </div>
    <div class="drawer-item" onclick="closeDrawer(); setTimeout(()=>alert('Naša Kuharica\n\nAplikacija za vaše recepte.\n\nSvi podaci čuvaju se lokalno na vašem uređaju.'), 100)">
      <span class="icon">ℹ️</span> O aplikaciji
    </div>
  </div>
</div>

<div class="modal" id="viewModal" onclick="if(event.target===this)closeModal('viewModal')">
  <div class="modal-content full">
    <div class="modal-header">
      <button class="close-btn" onclick="closeModal('viewModal')">✕</button>
      <h2>Recept</h2>
      <button class="action-btn" onclick="openRecipeActions()">⋮</button>
    </div>
    <div class="modal-body" id="viewBody"></div>
  </div>
</div>

<div class="modal" id="editModal" onclick="if(event.target===this)closeModal('editModal')">
  <div class="modal-content full">
    <div class="modal-header">
      <button class="close-btn" onclick="closeModal('editModal')">✕</button>
      <h2 id="editTitle">Novi recept</h2>
      <button class="action-btn" onclick="saveRecipe()">✓</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="recipeName">Naziv recepta</label>
        <input type="text" id="recipeName" placeholder="npr. Sarma">
      </div>
      <div class="form-group">
        <label for="recipeCategory">Kategorija</label>
        <select id="recipeCategory">
          <option value="">— Odaberi kategoriju —</option>
          <option value="Predjelo">Predjelo</option>
          <option value="Juhe">Juhe</option>
          <option value="Glavno jelo">Glavno jelo</option>
          <option value="Prilog">Prilog</option>
          <option value="Salate">Salate</option>
          <option value="Kolači">Kolači</option>
          <option value="Ostalo">Ostalo</option>
        </select>
      </div>
      <div class="form-group">
        <label for="recipeIngredients">Sastojci</label>
        <textarea id="recipeIngredients" placeholder="Po jedan sastojak u redu..." rows="6"></textarea>
      </div>
      <div class="form-group">
        <label for="recipePrep">Priprema</label>
        <textarea id="recipePrep" placeholder="Opišite postupak pripreme..." rows="8"></textarea>
      </div>
      <div class="form-group">
        <label for="recipeNote">Napomena</label>
        <textarea id="recipeNote" placeholder="Dodatne napomene, savjeti..." rows="3"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn secondary" onclick="closeModal('editModal')">Odustani</button>
        <button class="btn" onclick="saveRecipe()">Spremi</button>
      </div>
    </div>
  </div>
</div>

<div class="action-sheet" id="recipeActions" onclick="if(event.target===this)closeActionSheet()">
  <div class="action-sheet-content">
    <div class="action-sheet-title">Opcije recepta</div>
    <div class="action-sheet-item" onclick="editCurrent()">
      <span class="icon">✏️</span> Uredi
    </div>
    <div class="action-sheet-item" onclick="shareCurrent()">
      <span class="icon">📲</span> Pošalji (WhatsApp, Viber, Mail...)
    </div>
    <div class="action-sheet-item" onclick="exportCurrent()">
      <span class="icon">💾</span> Izvezi ovaj recept (JSON)
    </div>
    <div class="action-sheet-item" onclick="deleteCurrent()" style="color:#FF5555">
      <span class="icon">🗑️</span> Obriši
    </div>
    <div class="action-sheet-cancel" onclick="closeActionSheet()">Zatvori</div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json">

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'mojaKuharica_recepti_v1';
  let recipes = [];
  let currentId = null;
  let editingId = null;
  let activeCategory = 'sve';

  function loadRecipes() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      recipes = data ? JSON.parse(data) : [];
    } catch(e) { recipes = []; }
  }

  function saveRecipes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  function renderCategoryFilters() {
    const container = document.getElementById('categoryFilters');
    const cats = [...new Set(recipes.map(r => r.category).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'hr'));
    let html = `<button class="filter-chip ${activeCategory === 'sve' ? 'active' : ''}" onclick="setCategory('sve')">Sve</button>`;
    cats.forEach(c => {
      const active = activeCategory === c ? 'active' : '';
      html += `<button class="filter-chip ${active}" onclick="setCategory('${escapeAttr(c)}')">${escapeHtml(c)}</button>`;
    });
    const hasUncat = recipes.some(r => !r.category);
    if (hasUncat) {
      const active = activeCategory === '__none__' ? 'active' : '';
      html += `<button class="filter-chip ${active}" onclick="setCategory('__none__')">Bez kategorije</button>`;
    }
    container.innerHTML = html;
  }

  function setCategory(cat) {
    activeCategory = cat;
    renderList();
  }

  function escapeAttr(s) {
    return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateCounter() {
    const counter = document.getElementById('counter');
    const n = recipes.length;
    if (n === 0) counter.textContent = '';
    else if (n === 1) counter.textContent = '1 recept';
    else if (n >= 2 && n <= 4) counter.textContent = `${n} recepta`;
    else counter.textContent = `${n} recepata`;
  }

  function renderList() {
    const list = document.getElementById('recipeList');
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    let filtered = recipes;

    if (activeCategory === '__none__') {
      filtered = filtered.filter(r => !r.category);
    } else if (activeCategory !== 'sve') {
      filtered = filtered.filter(r => r.category === activeCategory);
    }

    if (q) {
      filtered = filtered.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.category || '').toLowerCase().includes(q) ||
        (r.ingredients || '').toLowerCase().includes(q) ||
        (r.preparation || '').toLowerCase().includes(q)
      );
    }

    renderCategoryFilters();
    updateCounter();

    if (filtered.length === 0) {
      if (recipes.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="ornament">~ Dobrodošli ~</div>
            <h2>Vaša kuharica je prazna</h2>
            <p>Pritisnite + dugme da dodate svoj prvi recept,<br>ili uvezite recepte iz datoteke kroz izbornik.</p>
          </div>`;
      } else {
        list.innerHTML = `
          <div class="empty-state">
            <h2>Nema rezultata</h2>
            <p>Niti jedan recept ne odgovara filteru.</p>
          </div>`;
      }
      return;
    }

    filtered.sort((a, b) => a.name.localeCompare(b.name, 'hr'));

    list.innerHTML = filtered.map(r => {
      const badge = r.category ? `<span class="category-badge">${escapeHtml(r.category)}</span>` : '';
      return `
        <div class="recipe-card" onclick="viewRecipe('${r.id}')">
          <h3>${escapeHtml(r.name)}</h3>
          ${badge}
        </div>`;
    }).join('');
  }

  function viewRecipe(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    currentId = id;

    const body = document.getElementById('viewBody');
    let html = `
      <div class="recipe-title">${escapeHtml(r.name)}</div>
      <div class="recipe-title-divider">• ◆ •</div>
    `;

    if (r.category) {
      html += `<div class="recipe-category"><span class="badge">${escapeHtml(r.category)}</span></div>`;
    }

    if (r.ingredients && r.ingredients.trim()) {
      html += `<div class="recipe-section"><h3>Sastojci</h3><div class="content">${escapeHtml(r.ingredients)}</div></div>`;
    }

    if (r.preparation && r.preparation.trim()) {
      html += `<div class="recipe-section"><h3>Priprema</h3><div class="content">${escapeHtml(r.preparation)}</div></div>`;
    }

    if (r.note && r.note.trim()) {
      html += `<div class="recipe-section note"><h3>Napomena</h3><div class="content">${escapeHtml(r.note)}</div></div>`;
    }

    body.innerHTML = html;
    openModal('viewModal');
  }

  function openEditor(id) {
    editingId = id || null;
    if (id) {
      const r = recipes.find(x => x.id === id);
      document.getElementById('editTitle').textContent = 'Uredi recept';
      document.getElementById('recipeName').value = r.name || '';
      document.getElementById('recipeCategory').value = r.category || '';
      document.getElementById('recipeIngredients').value = r.ingredients || '';
      document.getElementById('recipePrep').value = r.preparation || '';
      document.getElementById('recipeNote').value = r.note || '';
    } else {
      document.getElementById('editTitle').textContent = 'Novi recept';
      document.getElementById('recipeName').value = '';
      document.getElementById('recipeCategory').value = '';
      document.getElementById('recipeIngredients').value = '';
      document.getElementById('recipePrep').value = '';
      document.getElementById('recipeNote').value = '';
    }
    openModal('editModal');
  }

  function saveRecipe() {
    const name = document.getElementById('recipeName').value.trim();
    if (!name) { showToast('Molimo unesite naziv recepta'); return; }

    const data = {
      name: name,
      category: document.getElementById('recipeCategory').value,
      ingredients: document.getElementById('recipeIngredients').value.trim(),
      preparation: document.getElementById('recipePrep').value.trim(),
      note: document.getElementById('recipeNote').value.trim(),
      updated: Date.now()
    };

    if (editingId) {
      const idx = recipes.findIndex(x => x.id === editingId);
      if (idx >= 0) recipes[idx] = { ...recipes[idx], ...data };
      showToast('Recept ažuriran');
    } else {
      recipes.push({ id: uid(), created: Date.now(), ...data });
      showToast('Recept spremljen');
    }

    saveRecipes();
    renderList();
    closeModal('editModal');

    if (editingId && currentId === editingId) viewRecipe(editingId);
    editingId = null;
  }

  function editCurrent() {
    closeActionSheet();
    closeModal('viewModal');
    setTimeout(() => openEditor(currentId), 200);
  }

  function deleteCurrent() {
    closeActionSheet();
    const r = recipes.find(x => x.id === currentId);
    if (!r) return;
    if (confirm(`Obrisati recept "${r.name}"?`)) {
      recipes = recipes.filter(x => x.id !== currentId);
      saveRecipes();
      renderList();
      closeModal('viewModal');
      showToast('Recept obrisan');
    }
  }

  function formatRecipeText(r) {
    let txt = `🍴 *${r.name}*\n`;
    txt += `${'─'.repeat(Math.min(r.name.length + 4, 30))}\n`;
    if (r.category) txt += `_${r.category}_\n`;
    txt += `\n`;
    if (r.ingredients && r.ingredients.trim()) txt += `📝 *SASTOJCI*\n${r.ingredients}\n\n`;
    if (r.preparation && r.preparation.trim()) txt += `👩‍🍳 *PRIPREMA*\n${r.preparation}\n\n`;
    if (r.note && r.note.trim()) txt += `💡 *NAPOMENA*\n${r.note}\n\n`;
    txt += `\n— Naša Kuharica —`;
    return txt;
  }

  async function shareCurrent() {
    closeActionSheet();
    const r = recipes.find(x => x.id === currentId);
    if (!r) return;
    const text = formatRecipeText(r);

    if (navigator.share) {
      try {
        await navigator.share({ title: r.name, text: text });
      } catch(e) {
        if (e.name !== 'AbortError') fallbackShare(r, text);
      }
    } else {
      fallbackShare(r, text);
    }
  }

  function fallbackShare(r, text) {
    const encoded = encodeURIComponent(text);
    const subject = encodeURIComponent('Recept: ' + r.name);
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML = `
      <div style="background:#FFFFFF;padding:20px;border-radius:12px;max-width:340px;width:100%;border:1px solid #D9DEE5;box-shadow:0 8px 30px rgba(31,41,51,0.2)">
        <h3 style="font-family:'Cormorant Garamond',serif;color:#E30613;margin-bottom:8px;font-size:20px">Pošalji recept</h3>
        <p style="font-size:13px;color:#52606D;margin-bottom:14px">${escapeHtml(r.name)}</p>
        <a href="https://wa.me/?text=${encoded}" target="_blank" style="display:block;padding:14px;background:#25D366;color:white;text-decoration:none;border-radius:8px;margin-bottom:10px;text-align:center;font-weight:600">📱 WhatsApp</a>
        <a href="viber://forward?text=${encoded}" style="display:block;padding:14px;background:#7360F2;color:white;text-decoration:none;border-radius:8px;margin-bottom:10px;text-align:center;font-weight:600">💬 Viber</a>
        <a href="mailto:?subject=${subject}&body=${encoded}" style="display:block;padding:14px;background:#E30613;color:white;text-decoration:none;border-radius:8px;margin-bottom:10px;text-align:center;font-weight:600">✉️ Email</a>
        <button onclick="navigator.clipboard.writeText(\`${text.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`).then(()=>this.textContent='📋 Kopirano!')" style="display:block;width:100%;padding:14px;background:#52606D;color:white;border:none;border-radius:8px;text-align:center;font-weight:600;font-family:inherit;font-size:15px;cursor:pointer;margin-bottom:6px">📋 Kopiraj tekst</button>
        <button onclick="this.parentElement.parentElement.remove()" style="display:block;width:100%;padding:12px;background:transparent;border:1px solid #E30613;color:#E30613;border-radius:8px;font-family:inherit;font-size:15px;cursor:pointer">Zatvori</button>
      </div>`;
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    document.body.appendChild(modal);
  }

  function exportAll() {
    closeDrawer();
    if (recipes.length === 0) { showToast('Nema recepata za izvoz'); return; }
    const data = { app: 'MojaKuharica', version: 1, exported: new Date().toISOString(), recipes: recipes };
    downloadJson(data, `moja-kuharica-${formatDate()}.json`);
    showToast(`Izvezeno ${recipes.length} recepata`);
  }

  function exportCurrent() {
    closeActionSheet();
    const r = recipes.find(x => x.id === currentId);
    if (!r) return;
    const data = { app: 'MojaKuharica', version: 1, exported: new Date().toISOString(), recipes: [r] };
    const fname = `recept-${r.name.toLowerCase().replace(/[^a-z0-9čćžšđ]+/gi, '-')}.json`;
    downloadJson(data, fname);
    showToast('Recept izvezen');
  }

  function downloadJson(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }

  function formatDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function importRecipes() {
    closeDrawer();
    document.getElementById('fileInput').click();
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        let imported = [];
        if (Array.isArray(data)) imported = data;
        else if (data.recipes && Array.isArray(data.recipes)) imported = data.recipes;
        else if (data.name) imported = [data];
        else throw new Error('Nepoznat format');

        let added = 0, updated = 0;
        imported.forEach(item => {
          if (!item.name) return;
          const newRec = {
            id: item.id || uid(),
            name: item.name,
            category: item.category || item.kategorija || '',
            ingredients: item.ingredients || '',
            preparation: item.preparation || item.prep || '',
            note: item.note || item.napomena || '',
            created: item.created || Date.now(),
            updated: item.updated || Date.now()
          };
          const existing = recipes.findIndex(r => r.id === newRec.id);
          if (existing >= 0) {
            if (confirm(`Recept "${newRec.name}" već postoji. Prepisati?`)) {
              recipes[existing] = newRec;
              updated++;
            }
          } else {
            const sameName = recipes.find(r => r.name.toLowerCase() === newRec.name.toLowerCase());
            if (sameName) {
              if (confirm(`Recept "${newRec.name}" već postoji pod istim imenom. Dodati kao novi?`)) {
                newRec.id = uid();
                recipes.push(newRec);
                added++;
              }
            } else {
              recipes.push(newRec);
              added++;
            }
          }
        });
        saveRecipes();
        renderList();
        showToast(`Uvoz: ${added} novih, ${updated} ažurirano`);
      } catch(err) {
        alert('Greška kod uvoza: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  function openModal(id) {
    document.getElementById(id).classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
    document.body.style.overflow = '';
  }
  function openDrawer() {
    document.getElementById('drawer').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('active');
    document.body.style.overflow = '';
  }
  function openRecipeActions() {
    document.getElementById('recipeActions').classList.add('active');
  }
  function closeActionSheet() {
    document.getElementById('recipeActions').classList.remove('active');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  loadRecipes();
  renderList();
</script>

<script>
  // Registracija service workera (offline rad)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker nije registriran:', err);
      });
    });
  }
</script>
